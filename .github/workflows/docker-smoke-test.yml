name: Docker build and smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-management-api:ci .

      - name: Run container
        run: docker run -d --name task-management-api -p 3000:3000 task-management-api:ci

      - name: Check health endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs task-management-api
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f task-management-api || true
